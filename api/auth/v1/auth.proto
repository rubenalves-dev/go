syntax = "proto3";

package auth.v1;

option go_package = "raiiaa.dev/api/auth/v1;authv1";

service AuthService {
  rpc Signup(SignupRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
}

message SignupRequest {
  string email = 1;
  string password = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  string token = 1;
  User user = 2;
}

message User {
  int64 id = 1;
  string email = 2;
}
