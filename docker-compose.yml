services:
  postgres:
    image: postgres:16-alpine
    container_name: distributed-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

  auth-migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/auth-service/migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://app:app@postgres:5432/authdb?sslmode=disable",
        "up",
      ]
    restart: "no"

  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: auth-service
      LOG_LEVEL: info
      HTTP_ADDR: :8081
      DATABASE_URL: postgres://app:app@postgres:5432/authdb?sslmode=disable
      JWT_ISSUER: auth-service
      JWT_PRIVATE_KEY_PATH: /keys/dev-private.pem
      JWT_EXPIRY_MINUTES: 60
    volumes:
      - ./deploy/keys:/keys:ro
    ports:
      - "8081:8081"

  gateway:
    build:
      context: .
      dockerfile: ./services/gateway/Dockerfile
    depends_on:
      auth-service:
        condition: service_started
    environment:
      SERVICE_NAME: gateway
      LOG_LEVEL: info
      HTTP_ADDR: :8080
      AUTH_SERVICE_URL: http://auth-service:8081
    ports:
      - "8080:8080"

volumes:
  pg_data:
